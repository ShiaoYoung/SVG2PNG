<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG2PNG 图片转换工具</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="workspace" aria-labelledby="title">
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">S</span>
            <div>
              <p class="eyebrow">SVG2PNG</p>
              <h1 id="title">图片格式转换</h1>
            </div>
          </div>

          <nav class="tabs" aria-label="功能切换">
            <button class="tab-btn active" type="button" data-panel="svgToPng" aria-controls="svgToPng" aria-selected="true">
              SVG 转 PNG
            </button>
            <button class="tab-btn" type="button" data-panel="imageToSvg" aria-controls="imageToSvg" aria-selected="false">
              图片转 SVG
            </button>
          </nav>
        </header>

        <section class="tool-panel active" id="svgToPng" aria-label="SVG 转 PNG">
          <div class="tool-copy">
            <h2>SVG 转 PNG</h2>
            <p>拖入 SVG 文件或选择文件，在本地浏览器中转换并下载 PNG。</p>
          </div>

          <label class="drop-zone" id="svgDropZone" for="svgFileInput">
            <input id="svgFileInput" type="file" accept=".svg,image/svg+xml" />
            <span class="upload-icon" aria-hidden="true">+</span>
            <span class="upload-title">拖动 SVG 到这里</span>
            <span class="upload-subtitle">或点击选择文件</span>
          </label>

          <div class="status" id="svgStatus" role="status">等待上传 SVG 文件</div>

          <section class="preview-section" aria-label="SVG 转 PNG 结果">
            <div class="preview-header">
              <div>
                <h3>PNG 预览</h3>
                <p id="svgFileMeta">尚未生成图片</p>
              </div>
              <button class="download-btn" id="pngDownloadBtn" type="button" disabled>下载 PNG</button>
            </div>
            <div class="preview-frame">
              <img id="pngPreview" alt="转换后的 PNG 预览" />
              <span id="pngEmptyPreview">转换完成后将在这里预览</span>
            </div>
          </section>
        </section>

        <section class="tool-panel" id="imageToSvg" aria-label="图片转 SVG" hidden>
          <div class="tool-copy">
            <h2>图片转 SVG</h2>
            <p>上传 PNG、JPG、WebP 等图片，自动把白色区域透明化后导出为 SVG。</p>
          </div>

          <label class="drop-zone" id="imageDropZone" for="imageFileInput">
            <input id="imageFileInput" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/gif" />
            <span class="upload-icon" aria-hidden="true">+</span>
            <span class="upload-title">拖动图片到这里</span>
            <span class="upload-subtitle">支持 PNG、JPG、WebP、BMP、GIF</span>
          </label>

          <div class="control-row" aria-label="白色透明化设置">
            <label class="range-control" for="whiteTolerance">
              <span>白色识别范围</span>
              <input id="whiteTolerance" type="range" min="0" max="80" value="18" />
              <output id="whiteToleranceValue" for="whiteTolerance">18</output>
            </label>
          </div>

          <div class="status" id="imageStatus" role="status">等待上传图片文件</div>

          <section class="preview-section" aria-label="图片转 SVG 结果">
            <div class="preview-header">
              <div>
                <h3>SVG 预览</h3>
                <p id="imageFileMeta">尚未生成 SVG</p>
              </div>
              <button class="download-btn" id="svgDownloadBtn" type="button" disabled>下载 SVG</button>
            </div>
            <div class="preview-frame">
              <img id="svgPreview" alt="转换后的 SVG 预览" />
              <span id="svgEmptyPreview">转换完成后将在这里预览</span>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
